<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1a0a02;font-family:Georgia,serif">
  <text x="400" y="35" fill="#C68B3A" font-size="18" font-weight="bold" text-anchor="middle">DEF / SCR Aftertreatment System</text>

  <!-- Engine -->
  <rect x="30" y="180" width="100" height="80" rx="8" fill="#2a1505" stroke="#C68B3A" stroke-width="2"/>
  <text x="80" y="215" fill="#F5F0E8" font-size="12" text-anchor="middle">Engine</text>
  <text x="80" y="232" fill="#C68B3A" font-size="9" text-anchor="middle">Raw exhaust</text>
  <text x="80" y="245" fill="#C68B3A" font-size="9" text-anchor="middle">NOx + PM</text>

  <!-- DPF -->
  <rect x="180" y="170" width="100" height="100" rx="8" fill="#2a1505" stroke="#C68B3A" stroke-width="2"/>
  <text x="230" y="208" fill="#F5F0E8" font-size="12" text-anchor="middle">DPF</text>
  <text x="230" y="225" fill="#F5F0E8" font-size="9" text-anchor="middle">Diesel Particulate</text>
  <text x="230" y="240" fill="#F5F0E8" font-size="9" text-anchor="middle">Filter</text>
  <text x="230" y="258" fill="#C68B3A" font-size="9" text-anchor="middle">Captures soot</text>

  <!-- DOC -->
  <rect x="180" y="80" width="100" height="60" rx="6" fill="#1a2a1a" stroke="#70c070" stroke-width="1.5"/>
  <text x="230" y="107" fill="#F5F0E8" font-size="11" text-anchor="middle">DOC</text>
  <text x="230" y="122" fill="#70c070" font-size="9" text-anchor="middle">Oxidation Catalyst</text>
  <text x="230" y="135" fill="#F5F0E8" font-size="9" text-anchor="middle">Burns hydrocarbons</text>

  <!-- DEF injector -->
  <rect x="330" y="160" width="80" height="60" rx="6" fill="#1a1a3a" stroke="#70a0d4" stroke-width="2"/>
  <text x="370" y="185" fill="#F5F0E8" font-size="10" text-anchor="middle">DEF</text>
  <text x="370" y="200" fill="#F5F0E8" font-size="10" text-anchor="middle">Injector</text>
  <text x="370" y="215" fill="#70a0d4" font-size="9" text-anchor="middle">32.5% urea</text>

  <!-- SCR catalyst -->
  <rect x="460" y="160" width="110" height="100" rx="8" fill="#2a1505" stroke="#C68B3A" stroke-width="2"/>
  <text x="515" y="198" fill="#F5F0E8" font-size="12" text-anchor="middle">SCR</text>
  <text x="515" y="215" fill="#F5F0E8" font-size="9" text-anchor="middle">Selective Catalytic</text>
  <text x="515" y="230" fill="#F5F0E8" font-size="9" text-anchor="middle">Reduction</text>
  <text x="515" y="248" fill="#70c070" font-size="9" text-anchor="middle">NOx → N₂ + H₂O</text>

  <!-- Clean exhaust out -->
  <rect x="620" y="185" width="120" height="70" rx="8" fill="#1a2a1a" stroke="#70c070" stroke-width="2"/>
  <text x="680" y="213" fill="#F5F0E8" font-size="11" text-anchor="middle">Clean</text>
  <text x="680" y="230" fill="#F5F0E8" font-size="11" text-anchor="middle">Exhaust</text>
  <text x="680" y="247" fill="#70c070" font-size="9" text-anchor="middle">97% NOx reduction</text>

  <!-- DEF tank -->
  <rect x="330" y="320" width="80" height="80" rx="6" fill="#1a1a3a" stroke="#70a0d4" stroke-width="2"/>
  <text x="370" y="350" fill="#F5F0E8" font-size="10" text-anchor="middle">DEF</text>
  <text x="370" y="366" fill="#F5F0E8" font-size="10" text-anchor="middle">Tank</text>
  <text x="370" y="382" fill="#70a0d4" font-size="9" text-anchor="middle">5-25 gal</text>
  <text x="370" y="396" fill="#C68B3A" font-size="8" text-anchor="middle">Refill at 10%</text>

  <!-- NOx sensors -->
  <rect x="460" y="320" width="80" height="50" rx="6" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="500" y="342" fill="#F5F0E8" font-size="10" text-anchor="middle">NOx</text>
  <text x="500" y="357" fill="#F5F0E8" font-size="10" text-anchor="middle">Sensors</text>
  <text x="500" y="370" fill="#C68B3A" font-size="8" text-anchor="middle">Pre + Post SCR</text>

  <!-- ECM -->
  <rect x="600" y="310" width="110" height="70" rx="6" fill="#1a3a1a" stroke="#70c070" stroke-width="2"/>
  <text x="655" y="338" fill="#F5F0E8" font-size="11" text-anchor="middle">ECM</text>
  <text x="655" y="355" fill="#70c070" font-size="9" text-anchor="middle">Controls DEF</text>
  <text x="655" y="368" fill="#70c070" font-size="9" text-anchor="middle">dosing rate</text>

  <!-- Arrows -->
  <line x1="130" y1="220" x2="178" y2="220" stroke="#C68B3A" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="280" y1="220" x2="328" y2="195" stroke="#C68B3A" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="410" y1="190" x2="458" y2="210" stroke="#70a0d4" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="570" y1="210" x2="618" y2="220" stroke="#C68B3A" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="370" y1="320" x2="370" y2="222" stroke="#70a0d4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="500" y1="320" x2="500" y2="265" stroke="#C68B3A" stroke-width="1.5" stroke-dasharray="5,3"/>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C68B3A"/>
    </marker>
  </defs>

  <!-- Regen note -->
  <rect x="30" y="320" width="240" height="80" rx="6" fill="rgba(198,139,58,0.08)" stroke="rgba(198,139,58,0.3)" stroke-width="1"/>
  <text x="150" y="345" fill="#C68B3A" font-size="10" text-anchor="middle" font-weight="bold">DPF REGEN TEMPS</text>
  <text x="150" y="360" fill="#F5F0E8" font-size="9" text-anchor="middle">Passive: 575°F+ (highway)</text>
  <text x="150" y="375" fill="#F5F0E8" font-size="9" text-anchor="middle">Active: 1,000-1,200°F</text>
  <text x="150" y="390" fill="#e87070" font-size="9" text-anchor="middle">Clear area during forced regen!</text>
</svg>
