<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1a0a02;font-family:Georgia,serif">
  <text x="400" y="35" fill="#C68B3A" font-size="18" font-weight="bold" text-anchor="middle">Heavy Equipment Hydraulic System</text>

  <!-- Hydraulic tank/reservoir -->
  <rect x="30" y="200" width="100" height="120" rx="8" fill="#1a1a3a" stroke="#70a0d4" stroke-width="2"/>
  <text x="80" y="248" fill="#F5F0E8" font-size="11" text-anchor="middle">Hydraulic</text>
  <text x="80" y="264" fill="#F5F0E8" font-size="11" text-anchor="middle">Reservoir</text>
  <text x="80" y="280" fill="#70a0d4" font-size="9" text-anchor="middle">Check level daily</text>
  <text x="80" y="295" fill="#e87070" font-size="9" text-anchor="middle">AW46 / AW68</text>

  <!-- Hydraulic pump -->
  <ellipse cx="210" cy="250" rx="55" ry="55" fill="#2a1505" stroke="#C68B3A" stroke-width="2.5"/>
  <text x="210" y="245" fill="#F5F0E8" font-size="11" font-weight="bold" text-anchor="middle">Hydraulic</text>
  <text x="210" y="262" fill="#F5F0E8" font-size="11" text-anchor="middle">Pump</text>
  <text x="210" y="278" fill="#C68B3A" font-size="9" text-anchor="middle">Engine driven</text>

  <!-- Filter -->
  <rect x="300" y="220" width="70" height="70" rx="6" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="335" y="248" fill="#F5F0E8" font-size="10" text-anchor="middle">Hydro</text>
  <text x="335" y="263" fill="#F5F0E8" font-size="10" text-anchor="middle">Filter</text>
  <text x="335" y="278" fill="#C68B3A" font-size="8" text-anchor="middle">Change 500hrs</text>

  <!-- Control valve / bank -->
  <rect x="410" y="180" width="120" height="140" rx="8" fill="#2a1505" stroke="#C68B3A" stroke-width="2"/>
  <text x="470" y="230" fill="#F5F0E8" font-size="12" font-weight="bold" text-anchor="middle">Control</text>
  <text x="470" y="248" fill="#F5F0E8" font-size="12" text-anchor="middle">Valve Bank</text>
  <text x="470" y="268" fill="#C68B3A" font-size="9" text-anchor="middle">Boom / Stick</text>
  <text x="470" y="283" fill="#C68B3A" font-size="9" text-anchor="middle">Bucket / Travel</text>
  <text x="470" y="298" fill="#C68B3A" font-size="9" text-anchor="middle">Swing / Aux</text>

  <!-- Cylinders -->
  <rect x="580" y="160" width="80" height="50" rx="6" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="620" y="182" fill="#F5F0E8" font-size="10" text-anchor="middle">Boom</text>
  <text x="620" y="197" fill="#F5F0E8" font-size="10" text-anchor="middle">Cylinder</text>

  <rect x="580" y="225" width="80" height="50" rx="6" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="620" y="247" fill="#F5F0E8" font-size="10" text-anchor="middle">Stick</text>
  <text x="620" y="262" fill="#F5F0E8" font-size="10" text-anchor="middle">Cylinder</text>

  <rect x="580" y="290" width="80" height="50" rx="6" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="620" y="312" fill="#F5F0E8" font-size="10" text-anchor="middle">Bucket</text>
  <text x="620" y="327" fill="#F5F0E8" font-size="10" text-anchor="middle">Cylinder</text>

  <!-- Relief valve -->
  <rect x="410" y="100" width="90" height="55" rx="6" fill="#3a1010" stroke="#e87070" stroke-width="1.5"/>
  <text x="455" y="122" fill="#F5F0E8" font-size="10" text-anchor="middle">Relief</text>
  <text x="455" y="137" fill="#F5F0E8" font-size="10" text-anchor="middle">Valve</text>
  <text x="455" y="150" fill="#e87070" font-size="8" text-anchor="middle">3000-5000 PSI set</text>

  <!-- Cooler -->
  <rect x="200" y="380" width="100" height="55" rx="6" fill="#1a1a3a" stroke="#70a0d4" stroke-width="1.5"/>
  <text x="250" y="405" fill="#F5F0E8" font-size="10" text-anchor="middle">Oil Cooler</text>
  <text x="250" y="420" fill="#70a0d4" font-size="8" text-anchor="middle">Check for clogging</text>

  <!-- Pressure gauge -->
  <ellipse cx="700" cy="250" rx="40" ry="40" fill="#2a1505" stroke="#C68B3A" stroke-width="1.5"/>
  <text x="700" y="245" fill="#F5F0E8" font-size="9" text-anchor="middle">Pressure</text>
  <text x="700" y="260" fill="#C68B3A" font-size="9" text-anchor="middle">Gauge</text>

  <!-- Flow arrows -->
  <line x1="130" y1="250" x2="152" y2="250" stroke="#70a0d4" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="265" y1="250" x2="298" y2="250" stroke="#C68B3A" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="370" y1="255" x2="408" y2="255" stroke="#C68B3A" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="530" y1="200" x2="578" y2="190" stroke="#C68B3A" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="530" y1="250" x2="578" y2="250" stroke="#C68B3A" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="530" y1="305" x2="578" y2="310" stroke="#C68B3A" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- Return line -->
  <line x1="250" y1="380" x2="250" y2="325" stroke="#70a0d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="250" y1="380" x2="80" y2="380" stroke="#70a0d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="80" y1="380" x2="80" y2="322" stroke="#70a0d4" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Relief to tank -->
  <line x1="455" y1="100" x2="455" y2="60" stroke="#e87070" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="455" y1="60" x2="80" y2="60" stroke="#e87070" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="80" y1="60" x2="80" y2="198" stroke="#e87070" stroke-width="1.5" marker-end="url(#a3)"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#70a0d4"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C68B3A"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e87070"/></marker>
  </defs>

  <!-- Info box -->
  <rect x="30" y="425" width="740" height="60" rx="6" fill="rgba(198,139,58,0.06)" stroke="rgba(198,139,58,0.2)" stroke-width="1"/>
  <text x="400" y="445" fill="#C68B3A" font-size="10" text-anchor="middle" font-weight="bold">COMMON HYDRAULIC PROBLEMS</text>
  <text x="400" y="462" fill="#F5F0E8" font-size="9" text-anchor="middle">Slow/weak: check fluid level, filter, pump pressure | Drift: cylinder seals or control valve | Hot oil: cooler clogged or overloaded</text>
  <text x="400" y="478" fill="#e87070" font-size="9" text-anchor="middle">Low pressure warning: check relief valve setting (3000-5000 PSI typical) | Cavitation noise = low fluid or clogged suction</text>
</svg>
